# nginx config for unhrdb-api. Two parts — they go in different places.
#
#  PART 1 → a new file, /etc/nginx/conf.d/unhrdb-cache.conf
#           (conf.d/*.conf is already included from http{} in nginx.conf:69,
#           and proxy_cache_path is only valid at http{} level)
#  PART 2 → the server { listen 443 ssl http2; server_name 150.254.115.204; }
#           block in /etc/nginx/sites-enabled/default, replacing the existing
#           `location /unhrdb-api/ { ... }` (currently around line 188)
#
# Then:  sudo nginx -t && sudo systemctl reload nginx

upstream unhrdb_api {
  server 127.0.0.1:8002;
}


# ===========================================================================
# PART 1 — /etc/nginx/conf.d/unhrdb-cache.conf
# ===========================================================================
#
# WHY CACHE AT ALL: /api/search latency is ~4ms + ~7.7us per MATCHED row —
# two full walks of the FTS5 posting list, measured linear from 0 to 122,813
# matches on the deployed corpus. Rare, specific terms are already fast
# (refoulement 21ms, expulsion 42ms); it is the common words that cost
# ("torture" 22k matches ~250ms, "rights" 123k matches ~950ms). Cost
# therefore correlates with POPULARITY, which is the ideal shape for a
# cache: the expensive queries are the repeated ones.
#
# max_size is deliberately small — /var was at 93% (3.5G free) when this was
# written. Responses are ~25-30 KB, so 200m still holds ~6-7k of them.
# Check `df -h /var` before raising it.

proxy_cache_path /var/cache/nginx/unhrdb
                 levels=1:2
                 keys_zone=unhrdb:10m
                 max_size=200m
                 inactive=24h
                 use_temp_path=off;


# ===========================================================================
# PART 2 — replaces `location /unhrdb-api/` in sites-enabled/default
# ===========================================================================

location /unhrdb-api/ {
  rewrite ^/unhrdb-api/(.*)$ /$1 break;
  proxy_pass http://unhrdb_api;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # GZip is already on the API side; suppress nginx's own to avoid
  # double-compression CPU hit.
  gzip off;

  proxy_cache unhrdb;

  # GET/HEAD only, so POST /api/feedback is never cached.
  proxy_cache_methods GET HEAD;

  # Path + query. No cookies or auth are involved on this API, so the URI
  # alone fully determines the response. NOTE: the upstream gzips itself and
  # we pass its body through untouched, so Accept-Encoding stays in the key —
  # otherwise a client sending `identity` can be handed a gzipped body.
  proxy_cache_key "$request_uri|$http_accept_encoding";

  # The app advertises `max-age=120` to BROWSERS, which is right for them
  # but far too short for us: the DB is opened immutable=1 and only changes
  # when a rebuilt file is rsynced in, so a server-side entry stays correct
  # until the next deploy. Ignore the upstream freshness headers and set our
  # own. See the PURGE note below — this is what makes purging mandatory.
  proxy_ignore_headers Cache-Control Expires;
  proxy_cache_valid 200 1h;
  proxy_cache_valid 404 1m;

  # Collapse concurrent misses for the same key. Without this, ten people
  # searching "rights" at once trigger ten ~950ms scans; with it, one runs
  # and the rest wait on its result. This matters more than the hit rate:
  # it bounds what a burst of identical broad queries can do to the box.
  proxy_cache_lock on;
  proxy_cache_lock_timeout 15s;

  # Keep serving the last good answer while a refresh happens in the
  # background, and if the upstream is down or restarting. A stale search
  # result beats an error page on a read-only research corpus.
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;

  # HIT / MISS / EXPIRED / UPDATING — the only way to tell whether any of
  # the above is actually working. `always` so it shows on errors too.
  add_header X-Cache-Status $upstream_cache_status always;

  # Client-facing freshness, unchanged from before.
  add_header Cache-Control "public, max-age=120" always;
}


# ===========================================================================
# PURGE ON DEPLOY — NOT OPTIONAL
# ===========================================================================
# Because we override the upstream's freshness above, entries live for 1h
# regardless of what changed underneath. After rsyncing a rebuilt
# unhrdb.sqlite3, cached responses describe the OLD corpus and nothing will
# expire them early — proxy_cache_purge is nginx-plus only. So the deploy
# sequence is:
#
#   1. rsync the rebuilt data/unhrdb.sqlite3 to /home/amuvmuser/unhrdb/data/
#   2. cd /home/amuvmuser/unhrdb && docker compose up -d
#   3. curl -fsS http://127.0.0.1:8002/health   # must be 200, not 503 —
#      it now fails when the DB is older than the code (see schema_error()
#      in api/main.py)
#   4. sudo rm -rf /var/cache/nginx/unhrdb/*
#   5. sudo systemctl reload nginx
#
# Skipping 4 serves up to an hour of results from the previous corpus.
